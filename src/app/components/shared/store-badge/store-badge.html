<a
  [href]="link"
  target="_blank"
  rel="noopener noreferrer"
  class="group inline-flex items-center  border border-border bg-secondary text-secondary-foreground shadow-soft transition hover:-translate-y-0.5 hover:shadow-elevated"
  [ngClass]="{
    'px-5 py-3 rounded-[16px] gap-3': size === 'lg',
    'px-2 py-1 rounded-[10px] gap-2': size == 'sm',
  }"
>
  @if (isPlay) {
    <svg
      viewBox="0 0 24 24"
      class="fill-current"
      [ngClass]="{
        'h-7 w-7': size === 'lg',
        'h-4 w-4': size == 'sm',
      }"
      aria-hidden
    >
      <path
        d="M3.6 2.3 14 12 3.6 21.7c-.4-.3-.6-.8-.6-1.3V3.6c0-.5.2-1 .6-1.3zM15.6 13.6 5.7 22.4l11.3-6.4-1.4-2.4zM5.7 1.6 15.6 10.4l1.4-2.4L5.7 1.6zm12.1 7.6 3.2 1.8c.8.5.8 1.6 0 2.1l-3.2 1.8L16 12l1.8-2.8z"
      />
    </svg>
  } @else {
    <ng-icon [svg]="lucideApple" class="h-7 w-7" />
  }
  <div class="text-left leading-tight">
    <div
      class="uppercase tracking-wider opacity-80"
      [ngClass]="{
        'text-[10px]': size === 'lg',
        'text-[5px]': size == 'sm',
      }"
    >
      {{ isPlay ? "Get it on" : "Download on the" }}
    </div>
    <div
      class="text-base font-bold"
      [ngClass]="{
        'font-display': size === 'lg',
        'text-[10px] font-bold': size == 'sm',
      }"
    >
      {{ isPlay ? "Google Play" : "App Store" }}
    </div>
  </div>
</a>

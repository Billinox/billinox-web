<app-tool-layout [tag]="tag" [title]="title" [description]="description">
  <section class="py-24">
    <div class="mx-auto max-w-7xl px-4">
      <div class="grid grid-cols-12 lg:gap-10 mb-10 items-start">
        <div class="col-span-12 lg:col-span-8 mb-10 lg:mb-0">
          <app-document-editor />
        </div>

        <div class="col-span-12 lg:col-span-4 sticky top-20 ...">
          <!-- Themes -->
          <div class="mb-15">
            <p class="font-bold mb-3">Themes</p>
            <app-document-theme-selector />
          </div>

          <!-- Templates -->
          <div class="mb-15">
            <p class="font-bold mb-3">Templates</p>
            <app-document-template-selector />
          </div>

          <!-- CTA -->
          <div class="mb-15">
            <app-document-cta label="Invoice" />
          </div>

          <!-- App Promo -->
          <div>
            <app-store-promo />
          </div>
        </div>
      </div>

      <div class="">
        <h2 class="font-bold mb-3">Frequently Asked Questions</h2>
        <app-tool-faq [items]="faqs" />
      </div>
    </div>
  </section>
</app-tool-layout>

<hlm-dialog-header>
  <h3 hlmDialogTitle>Product or Service Details</h3>
</hlm-dialog-header>

<form class="my-3" [formGroup]="itemForm" hlmFieldGroup>
  <div hlmField>
    <textarea
      hlmTextarea
      placeholder="Description"
      formControlName="description"
      maxlength="250"
    ></textarea>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div hlmField>
      <label for="price" hlmLabel>Price</label>
      <input
        hlmInput
        type="number"
        placeholder="Price"
        formControlName="price"
        id="price"
      />
    </div>

    <div hlmField>
      <label for="quantity" hlmLabel>Quantity</label>
      <input
        hlmInput
        type="number"
        placeholder="Quantity"
        formControlName="quantity"
      />
    </div>
  </div>
</form>

<hlm-dialog-footer>
  @if (item) {
    <button
      hlmBtn
      aria-label="Delete item"
      type="button"
      size="lg"
      variant="destructive"
      (click)="remove()"
    >
      Delete
    </button>
  }
  <button
    hlmBtn
    aria-label="Save item"
    size="lg"
    type="button"
    [class.w-full]="!item"
    [class.w-100]="item"
    (click)="save()"
  >
    Save
  </button>
</hlm-dialog-footer>

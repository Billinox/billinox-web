<hlm-dialog-header>
  <h3 hlmDialogTitle>Item Details</h3>
</hlm-dialog-header>

<form class="mt-3" [formGroup]="itemForm" hlmFieldGroup>
  <div hlmField>
    <textarea
      hlmTextarea
      placeholder="Description"
      formControlName="description"
      maxlength="250"
    ></textarea>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div hlmField>
      <label for="price" hlmLabel>Price</label>
      <input hlmInput type="number" placeholder="Price" formControlName="price" id="price" />
    </div>

    <div hlmField>
      <label for="quantity" hlmLabel>Quantity</label>
      <input hlmInput type="number" placeholder="Quantity" formControlName="quantity" />
    </div>
  </div>

  <button aria-label="Save item" type="submit" class="w-full" size="lg" hlmBtn (click)="save()">Save</button>
</form>

<hlm-dialog-header>
  <h3 hlmDialogTitle>Tax (%)</h3>
</hlm-dialog-header>

<form class="mt-3" [formGroup]="taxForm" hlmFieldGroup>
  <div hlmField>
    <input hlmInput placeholder="Name" formControlName="name" id="tax-name" />
  </div>

  <div hlmField>
    <input
      hlmInput
      type="number"
      placeholder="Tax"
      formControlName="percent"
      min="0"
      max="100"
      id="tax"
    />
  </div>

  <button aria-label="Save tax" type="submit" class="w-full" size="lg" hlmBtn (click)="save()">Save</button>
</form>

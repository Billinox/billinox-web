<hlm-dialog-header>
  <h3 hlmDialogTitle>Tax (%)</h3>
</hlm-dialog-header>

<form class="my-3" [formGroup]="taxForm" hlmFieldGroup>
  <div hlmField>
    <input hlmInput placeholder="Name" formControlName="name" id="tax-name" />
  </div>

  <div hlmField>
    <input
      hlmInput
      type="number"
      placeholder="Tax"
      formControlName="percent"
      min="0"
      max="100"
      id="tax"
    />
  </div>
</form>

<hlm-dialog-footer>
  @if (tax) {
    <button
      aria-label="Delete tax"
      type="button"
      size="lg"
      variant="destructive"
      hlmBtn
      (click)="remove()"
    >
      Delete
    </button>
  }

  <button
    aria-label="Save tax"
    type="button"
    [class.w-full]="!tax"
    [class.w-100]="tax"
    size="lg"
    hlmBtn
    (click)="save()"
  >
    Save
  </button>
</hlm-dialog-footer>

<hlm-dialog-header>
  <h3 hlmDialogTitle>Terms & Conditions</h3>
</hlm-dialog-header>

<form class="my-3" [formGroup]="termForm" hlmFieldGroup>
  <div hlmField>
    <textarea
      hlmTextarea
      placeholder="Description"
      formControlName="description"
      id="description"
      class="resize-none"
    ></textarea>
  </div>
</form>

<hlm-dialog-footer>
  @if (term) {
    <button
      aria-label="Delete term & condition"
      type="button"
      size="lg"
      variant="destructive"
      hlmBtn
      (click)="remove()"
    >
      Delete
    </button>
  }
  
  <button
    aria-label="Save term & condition"
    type="button"
    size="lg"
    hlmBtn
    [class.w-full]="!term"
    [class.w-100]="term"
    (click)="save()"
  >
    Save
  </button>
</hlm-dialog-footer>

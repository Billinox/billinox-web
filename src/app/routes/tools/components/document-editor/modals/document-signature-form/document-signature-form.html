<hlm-dialog-header>
  <h3 hlmDialogTitle>Signature</h3>
</hlm-dialog-header>

<div class="flex flex-col my-3" hlmFieldGroup>
  <div hlmField>
    <input type="text" placeholder="Label" hlmInput [formControl]="labelControl" />
  </div>

  <div
    class="w-full h-[200px] border border-border rounded-md bg-surface-elevated"
  >
    <canvas class="w-full h-full touch-none block" #canvasElement></canvas>
  </div>

  <p class="text-xs text-muted-foreground text-center">Sign in the box</p>
</div>

<hlm-dialog-footer>
  <button hlmBtn aria-label="Clear signature" variant="secondary" type="button" (click)="clear()">
    Clear
  </button>
  <button aria-label="Save signature" class="w-100" hlmBtn (click)="save()">Save</button>
</hlm-dialog-footer>

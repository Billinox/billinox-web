<hlm-dialog-header>
  <h3 hlmDialogTitle>Discount (%)</h3>
</hlm-dialog-header>

<form class="mt-3" [formGroup]="discountForm" hlmFieldGroup>
  <div hlmField>
    <input
      hlmInput
      type="number"
      placeholder="Discount"
      formControlName="percent"
      min="0"
      max="100"
      id="discount"
    />
  </div>

  <button type="submit" class="w-full" size="lg" hlmBtn (click)="save()">Save</button>
</form>

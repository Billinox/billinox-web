<div
  class="group rounded-2xl border border-border bg-surface-elevated p-6 flex justify-between items-center cursor-pointer"
  role="button"
  aria-roledescription="Open due date form"
  (click)="openForm()"
>
  <div>
    <p>{{ state().documentNo }}</p>
    <p class="text-xs text-surface-secondary/100">
      Due on {{ state().dueDate | date: 'MMM d, y'}}
    </p>
  </div>

  <ng-icon [svg]="lucideChevronRight" class="h-10 w-10" />
</div>

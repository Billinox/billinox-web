<div
  class="group rounded-2xl border border-border bg-surface-elevated flex flex-col"
>
  <ng-container
    [ngTemplateOutlet]="button"
    [ngTemplateOutletContext]="{
      data: {
        icon: lucideIdCard,
        title: 'Bill From',
        subtitle: 'Add Business',
      },
    }"
  />

  <hr />

  <ng-container
    [ngTemplateOutlet]="button"
    [ngTemplateOutletContext]="{
      data: {
        icon: lucideUsers,
        title: 'Bill To',
        subtitle: 'Add Customer',
      },
    }"
  />
</div>

<ng-template let-data="data" #button>
  <div
    class="flex justify-between items-center p-6 cursor-pointer"
    role="button"
    aria-role="button"
  >
    <div class="flex gap-3">
      <div
        class="rounded-full w-[40px] h-[40px] bg-primary/30 flex items-center justify-center"
      >
        <ng-icon [svg]="data.icon" [size]="'20px'" />
      </div>

      <div class="flex flex-col">
        <p class="text-xs text-secondary/50 mb-0">{{ data.title }}</p>
        <p>{{ data.subtitle }}</p>
      </div>
    </div>

    <ng-icon [svg]="lucideChevronRight" />
  </div>
</ng-template>

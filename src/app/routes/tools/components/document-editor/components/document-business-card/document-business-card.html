<div
  class="group rounded-2xl border border-border bg-surface-elevated flex flex-col"
>
  <ng-container
    [ngTemplateOutlet]="button"
    [ngTemplateOutletContext]="{
      data: {
        icon: lucideIdCard,
        title: 'Bill From',
        subtitle: state().business ? state().business?.name : 'Add Business',
      },
      clicked: openBusinessForm,
    }"
  />

  <hr />

  <ng-container
    [ngTemplateOutlet]="button"
    [ngTemplateOutletContext]="{
      data: {
        icon: lucideUsers,
        title: 'Bill To',
        subtitle: state().customer ? state().customer?.name : 'Add Customer',
      },
      clicked: openCustomerForm,
    }"
  />
</div>

<ng-template let-data="data" let-clicked="clicked" #button>
  <div
    class="flex justify-between items-center p-6 cursor-pointer select-none"
    role="button"
    aria-roledescription="Open modal"
    (click)="clicked()"
  >
    <div class="flex gap-3">
      <div
        class="rounded-full w-[40px] h-[40px] bg-primary/30 flex items-center justify-center"
      >
        <ng-icon [svg]="data.icon" [size]="'20px'" />
      </div>

      <div class="flex flex-col">
        <p class="text-xs text-muted-foreground mb-0">{{ data.title }}</p>
        <p>{{ data.subtitle }}</p>
      </div>
    </div>

    <ng-icon [svg]="lucideChevronRight" />
  </div>
</ng-template>

<app-tool-layout>
  <section class="py-16">
    <div class="mx-auto max-w-7xl px-4">
      <div class="grid grid-cols-12 gap-10">
        <div class="col-span-12 lg:col-span-8">
          <app-document-editor />
        </div>

        <div class="col-span-12 lg:col-span-4 sticky top-0">
          <div class="flex gap-3 mb-10">
            <button hlmBtn [size]="'lg'" type="button" class="w-per-100">
              <ng-icon [svg]="lucideSend" />
              Send Invoice
            </button>
            <button
              hlmBtn
              variant="secondary"
              [size]="'lg'"
              type="button"
              class="w-per-100"
            >
             <ng-icon [svg]="lucideCloudDownload" />
              Download
            </button>
          </div>

          <app-store-promo />
        </div>
      </div>
    </div>
  </section>
</app-tool-layout>

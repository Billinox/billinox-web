<app-tool-layout>
  <section class="py-24">
    <div class="mx-auto max-w-7xl px-4">
      <div class="grid grid-cols-12 lg:gap-10">
        <div class="col-span-12 lg:col-span-8 mb-10 lg:mb-0">
          <app-document-editor />
        </div>

        <div class="col-span-12 lg:col-span-4 sticky top-0">
          <!-- Templates -->
          <div class="mb-10">
            <p class="font-bold mb-3">Templates</p>
            <app-document-template-selector [templates]="templates" [selected]="templates[0]" />
          </div>

          <!-- CTA -->
          <div class="grid grid-cols-2 gap-4 mb-10">
            <button hlmBtn [size]="'lg'" type="button" class="w-full gap-3">
              <ng-icon [svg]="lucideSend" size="20px" />
              <span>Send Invoice</span>
            </button>
            <button
              hlmBtn
              variant="secondary"
              [size]="'lg'"
              type="button"
              class="w-full gap-3"
            >
              <ng-icon [svg]="lucideCloudDownload" size="20px" />
             <span>Download</span>
            </button>
          </div>

          <!-- App Promo -->
          <app-store-promo />
        </div>
      </div>
    </div>
  </section>
</app-tool-layout>
